{% extends "base.html" %}

{% block title %}Set New Password{% endblock %}

{% block content %}
<main class="app-page auth-page">
    <section class="auth-shell single-auth">
        <div class="form-container auth-card">
            <p class="eyebrow">Fresh start</p>
            <h2>Set a New Password</h2>
            <p class="form-note">For <strong>{{ email }}</strong></p>

            <form method="POST" action="{{ url_for('set_new_password') }}">
                <input type="password" name="new_password" placeholder="New password" required>
                <button class="btn" type="submit">Set Password</button>
            </form>

            <div class="form-links">
                <a href="{{ url_for('login') }}">Back to Login</a>
            </div>
        </div>
    </section>
</main>
{% endblock %}
