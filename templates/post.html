{% extends "base.html" %}

{% block title %}Create Post{% endblock %}

{% block content %}
    <h1>Share Your Feelings</h1>

    <nav>
        <a href="{{ url_for('dashboard') }}">Dashboard</a> |
        <a href="{{ url_for('post') }}">Create Post</a> |
        <a href="{{ url_for('chat') }}">Chat</a> |
        <a href="{{ url_for('diary') }}">Diary</a> |
        {% if user.lower() == 'admin' %}
            <a href="{{ url_for('database_view') }}">Database</a> |
        {% endif %}
        <a href="{{ url_for('logout') }}">Logout</a>
    </nav>

    <form method="POST" class="diary-form">
        <textarea name="content" rows="6" placeholder="Write something..." required></textarea>
        <button type="submit">Post</button>
    </form>
{% endblock %}
