{% extends "base.html" %}

{% block title %}Create Post{% endblock %}

{% block content %}
<main class="app-page auth-page">
    <section class="auth-shell">
        <div class="auth-copy">
            <p class="eyebrow">Share</p>
            <h1>Turn a feeling into a post.</h1>
            <p>Add a thought, attach an image if it helps, and let others respond with care.</p>
        </div>

        <div class="form-container auth-card">
            <h2>Share Your Feelings</h2>
            <form method="POST" enctype="multipart/form-data" class="post-create-form">
                <input type="hidden" name="post_token" value="{{ post_token }}">
                <textarea name="content" rows="6" placeholder="Write something..." required></textarea>
                <label for="image">Upload an image</label>
                <input type="file" name="image" id="image" accept="image/*">
                <button class="btn" type="submit">Post</button>
            </form>
        </div>
    </section>
</main>
<script>
    document.querySelectorAll('.post-create-form').forEach((form) => {
        form.addEventListener('submit', () => {
            const submitButton = form.querySelector('button[type="submit"]');
            if (submitButton) {
                submitButton.disabled = true;
                submitButton.textContent = 'Posting...';
            }
        });
    });
</script>
{% endblock %}
