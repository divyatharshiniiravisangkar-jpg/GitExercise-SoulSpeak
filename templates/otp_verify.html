{% extends "base.html" %}

{% block title %}Verify OTP{% endblock %}

{% block content %}
<main class="app-page auth-page">
    <section class="auth-shell single-auth">
        <div class="form-container auth-card">
            <p class="eyebrow">Email check</p>
            <h2>Verify your email</h2>
            <p class="form-note">We sent an OTP to <strong>{{ email }}</strong>. Enter it below to complete registration.</p>

            {% if show_otp and otp %}
                <div class="otp-display">
                    <span>Test OTP</span>
                    <strong>{{ otp }}</strong>
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('verify_otp') }}">
                <input type="hidden" name="email" value="{{ email }}">
                <input type="text" name="otp" placeholder="Enter OTP" required>
                <button class="btn" type="submit">Verify</button>
            </form>

            <form method="POST" action="{{ url_for('resend_otp') }}" class="secondary-form">
                <input type="hidden" name="email" value="{{ email }}">
                <button class="btn secondary-btn" type="submit">Resend OTP</button>
            </form>

            <div class="form-links">
                <a href="{{ url_for('register') }}">Back to Register</a>
            </div>
        </div>
    </section>
</main>
{% endblock %}
