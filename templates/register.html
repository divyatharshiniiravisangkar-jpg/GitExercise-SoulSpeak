{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<main class="app-page auth-page">
    <section class="auth-shell">
        <div class="auth-copy">
            <p class="eyebrow">Start here</p>
            <h1>Create your SoulSpeak account.</h1>
            <p>Keep your reflections, share posts, and join conversations in a calm place made for honest thoughts.</p>
        </div>

        <div class="form-container auth-card">
            <h2>Register</h2>
            <form method="POST" action="{{ url_for('register') }}">
                <input type="text" name="username" placeholder="Username" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>

                <label for="security_question">Security question</label>
                <select name="security_question" id="security_question" required>
                    <option value="What was your first pet's name?">What was your first pet's name?</option>
                    <option value="What is your mother's name?">What is your mother's name?</option>
                    <option value="What is the name of your elementary school?">What is the name of your elementary school?</option>
                    <option value="What is your favorite book?">What is your favorite book?</option>
                </select>

                <input type="text" name="security_answer" placeholder="Answer to security question" required>
                <button class="btn" type="submit">Register</button>
            </form>

            <div class="form-links">
                <a href="{{ url_for('login') }}">Already have an account?</a>
            </div>
        </div>
    </section>
</main>
{% endblock %}
